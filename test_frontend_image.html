<!DOCTYPE html>
<html>
<head>
    <title>Test ADAM Image Upload</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        button { padding: 10px; margin: 10px; }
        #result { margin-top: 20px; padding: 10px; background: #f0f0f0; }
        img { max-width: 300px; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test ADAM Image Upload</h1>
        
        <input type="file" id="fileInput" accept="image/*">
        <button onclick="testUpload()">Upload to ADAM</button>
        
        <div id="result"></div>
    </div>

    <script>
        async function testUpload() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select an image first');
                return;
            }
            
            // Check file size (20MB limit)
            if (file.size > 20 * 1024 * 1024) {
                alert('File too large. Maximum size is 20MB');
                return;
            }
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Processing...';
            
            try {
                // Convert to base64
                const base64 = await fileToBase64(file);
                const base64Data = base64.split(',')[1]; // Remove data:image/jpeg;base64, prefix
                
                // Get conversations
                const projectsRes = await fetch('http://localhost:8000/api/projects');
                const projects = await projectsRes.json();
                
                if (!projects.length) {
                    throw new Error('No projects found');
                }
                
                const projectId = projects[0].id;
                
                // Get conversations
                const convsRes = await fetch(`http://localhost:8000/api/projects/${projectId}/conversations`);
                const conversations = await convsRes.json();
                
                let conversationId;
                if (!conversations.length) {
                    // Create a conversation
                    const createRes = await fetch(`http://localhost:8000/api/projects/${projectId}/conversations`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title: 'Test Image Upload' })
                    });
                    const newConv = await createRes.json();
                    conversationId = newConv.id;
                } else {
                    conversationId = conversations[0].id;
                }
                
                // Send message with image
                const messageData = {
                    content: "What's in this image?",
                    use_memory: true,
                    model: "grok-2-vision-1212",
                    has_image: true,
                    image_data: base64Data
                };
                
                console.log('Sending request with image size:', base64Data.length);
                
                const response = await fetch(`http://localhost:8000/api/conversations/${conversationId}/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(messageData)
                });
                
                if (!response.ok) {
                    const error = await response.text();
                    throw new Error(`Server error: ${response.status} - ${error}`);
                }
                
                const messages = await response.json();
                
                // Display result
                let html = '<h3>Success!</h3>';
                html += `<img src="${base64}" alt="Uploaded image">`;
                html += '<h4>Messages:</h4>';
                messages.forEach(msg => {
                    html += `<p><strong>${msg.role}:</strong> ${msg.content}</p>`;
                    if (msg.model) {
                        html += `<p><em>Model: ${msg.model}, Tokens: ${msg.tokens_used}</em></p>`;
                    }
                });
                
                resultDiv.innerHTML = html;
                
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
        
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
    </script>
</body>
</html>
