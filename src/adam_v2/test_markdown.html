<\!DOCTYPE html>
<html>
<head>
    <title>Test Markdown</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .font-semibold { font-weight: 600; }
        .italic { font-style: italic; }
        .inline-code { 
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        // Copy of parseMessageContent function
        function parseMessageContent(content) {
            const parts = [];
            let remaining = content;
            
            while (remaining.length > 0) {
                const boldMatch = remaining.match(/^\*\*([^*\n]+)\*\*/);
                if (boldMatch) {
                    const [fullMatch, text] = boldMatch;
                    parts.push({ type: 'bold', content: text });
                    remaining = remaining.slice(fullMatch.length);
                    continue;
                }
                
                const inlineCodeMatch = remaining.match(/^`([^`\n]+)`/);
                if (inlineCodeMatch) {
                    const [fullMatch, code] = inlineCodeMatch;
                    parts.push({ type: 'inline-code', content: code });
                    remaining = remaining.slice(fullMatch.length);
                    continue;
                }
                
                const nextSpecialIndex = remaining.search(/[`*]/);
                if (nextSpecialIndex === -1) {
                    parts.push({ type: 'text', content: remaining });
                    remaining = '';
                } else if (nextSpecialIndex === 0) {
                    parts.push({ type: 'text', content: remaining[0] });
                    remaining = remaining.slice(1);
                } else {
                    parts.push({ type: 'text', content: remaining.slice(0, nextSpecialIndex) });
                    remaining = remaining.slice(nextSpecialIndex);
                }
            }
            
            return parts;
        }
        
        function TestComponent() {
            const testContent = "This is **bold text** and this is `inline code` test";
            const parsed = parseMessageContent(testContent);
            
            return (
                <div>
                    <h2>Test Content:</h2>
                    <p>{testContent}</p>
                    <h2>Parsed:</h2>
                    <pre>{JSON.stringify(parsed, null, 2)}</pre>
                    <h2>Rendered:</h2>
                    <div>
                        {parsed.map((part, i) => {
                            switch(part.type) {
                                case 'bold':
                                    return <strong key={i} className="font-semibold">{part.content}</strong>;
                                case 'inline-code':
                                    return <code key={i} className="inline-code">{part.content}</code>;
                                default:
                                    return part.content;
                            }
                        })}
                    </div>
                </div>
            );
        }
        
        ReactDOM.render(<TestComponent />, document.getElementById('root'));
    </script>
</body>
</html>
