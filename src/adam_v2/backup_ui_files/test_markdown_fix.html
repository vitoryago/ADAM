<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 p-8">
    <h1 class="text-2xl mb-4">Markdown Rendering Test</h1>
    
    <div id="test-output" class="bg-gray-800 p-4 rounded"></div>
    
    <script>
        // Copy the exact renderer from base.html
        const renderer = new marked.Renderer();
        
        // Custom code block rendering
        renderer.code = function(code, language) {
            const langClass = language ? `language-${language}` : '';
            const langDisplay = {
                'js': 'JavaScript', 'javascript': 'JavaScript',
                'py': 'Python', 'python': 'Python',
                'bash': 'Bash', 'sh': 'Shell', 'shell': 'Shell',
                'sql': 'SQL', 'json': 'JSON',
                'yaml': 'YAML', 'yml': 'YAML',
                'html': 'HTML', 'css': 'CSS',
                'typescript': 'TypeScript', 'ts': 'TypeScript',
                'go': 'Go', 'rust': 'Rust', 'java': 'Java',
                'cpp': 'C++', 'c': 'C', 'cs': 'C#',
                'php': 'PHP', 'ruby': 'Ruby', 'r': 'R',
                'swift': 'Swift', 'kotlin': 'Kotlin',
                'scala': 'Scala', 'dockerfile': 'Dockerfile',
                'xml': 'XML', 'markdown': 'Markdown', 'md': 'Markdown'
            };
            
            const displayName = langDisplay[language?.toLowerCase()] || (language ? language.toUpperCase() : 'Code');
            
            return `<div class="relative group my-4">
                <div class="bg-gray-900 border border-gray-700 rounded-lg overflow-hidden">
                    <div class="bg-gray-800 px-4 py-2 border-b border-gray-700 flex items-center justify-between">
                        <span class="text-xs text-gray-400 font-medium">${displayName}</span>
                        <button onclick="copyCode(this)" class="px-2 py-1 bg-gray-700 hover:bg-gray-600 rounded text-xs opacity-0 group-hover:opacity-100 transition-opacity">Copy</button>
                    </div>
                    <pre class="p-4 overflow-x-auto"><code class="${langClass}">${code}</code></pre>
                </div>
            </div>`;
        };
        
        // Configure marked options
        marked.setOptions({
            renderer: renderer,
            highlight: function(code, lang) {
                if (Prism.languages[lang]) {
                    return Prism.highlight(code, Prism.languages[lang], lang);
                }
                return code;
            },
            breaks: true,
            gfm: true,
            sanitize: false
        });
        
        // Test markdown content (simulating the DBT response)
        const testMarkdown = `Below is my conversion of the provided LookML PDT into a dbt model.

### dbt Model Configuration

Add this to your \`dbt_project.yml\`:

\`\`\`yaml
models:
  my_project:
    leads_only_approved_by_lending_club:
      materialized: table
\`\`\`

### dbt Model SQL

Create a file named \`leads_only_approved_by_lending_club.sql\`:

\`\`\`sql
-- models/leads_only_approved_by_lending_club.sql
{{
  config(
    materialized='table'
  )
}}

WITH aggregated_leads AS (
  SELECT 
    lead_uuid,
    SUM(
      CASE 
        WHEN last_demand_api_response_type = 'approval' 
          AND demand_sub_account_name = '{{ var("demand_partner_sub_account_name", "Lending Club") }}'
        THEN 1 
        ELSE 0 
      END
    ) AS approved_by_lender,
    SUM(
      CASE 
        WHEN last_demand_api_response_type = 'approval' 
          AND demand_sub_account_name != '{{ var("demand_partner_sub_account_name", "Lending Club") }}'
        THEN 1 
        ELSE 0 
      END
    ) AS rejected_by_lender
  FROM {{ source('public', 'lead_by_demand') }}
  GROUP BY lead_uuid
)

SELECT DISTINCT lead_uuid
FROM aggregated_leads
WHERE approved_by_lender > 0
  AND rejected_by_lender = 0
\`\`\`

This is a test with inline \`code\` as well.`;
        
        // Test rendering
        console.log("Testing markdown rendering...");
        
        try {
            const html = marked.parse(testMarkdown);
            console.log("Rendered HTML type:", typeof html);
            console.log("First 500 chars:", html.substring(0, 500));
            
            // Check if it contains [object Object]
            if (html.includes('[object Object]')) {
                console.error("ERROR: Found [object Object] in output!");
            } else {
                console.log("SUCCESS: No [object Object] found");
            }
            
            document.getElementById('test-output').innerHTML = html;
            
            // Highlight code blocks
            setTimeout(() => {
                Prism.highlightAll();
            }, 100);
            
        } catch (error) {
            console.error("Error rendering markdown:", error);
        }
        
        function copyCode(button) {
            console.log("Copy button clicked");
        }
    </script>
</body>
</html>
