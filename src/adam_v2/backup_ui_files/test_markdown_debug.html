<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div id="test"></div>
    <script>
        // Test if marked.js is working correctly
        const testMarkdown = `
# Test Heading

Here's some SQL code:

\`\`\`sql
SELECT * FROM users WHERE id = 1;
\`\`\`

And some inline \`code\`.
        `;
        
        // Test 1: Basic marked.parse
        console.log("Test 1 - Basic marked.parse:");
        const result1 = marked.parse(testMarkdown);
        console.log(typeof result1);
        console.log(result1);
        
        // Test 2: With custom renderer
        const renderer = new marked.Renderer();
        renderer.code = function(code, language) {
            console.log("Code block:", {code, language});
            return `<pre><code class="language-${language}">${code}</code></pre>`;
        };
        
        marked.setOptions({
            renderer: renderer
        });
        
        console.log("\nTest 2 - With custom renderer:");
        const result2 = marked.parse(testMarkdown);
        console.log(typeof result2);
        console.log(result2);
        
        document.getElementById('test').innerHTML = result2;
    </script>
</body>
</html>
