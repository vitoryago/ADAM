<!DOCTYPE html>
<html>
<head>
    <title>Test Markdown Rendering</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 p-8">
    <h1 class="text-2xl mb-4">Markdown Test</h1>
    
    <div id="input-area" class="mb-4">
        <textarea id="markdown-input" class="w-full h-64 p-4 bg-gray-800 text-white" placeholder="Enter markdown here...">
Here's some DBT code:

```sql
SELECT * FROM users
WHERE active = true
```

And some inline `code` too.
        </textarea>
        <button onclick="renderTest()" class="mt-2 px-4 py-2 bg-blue-600 text-white rounded">Render</button>
    </div>
    
    <div id="output" class="prose prose-invert max-w-none"></div>
    
    <script>
        // Simple marked setup
        marked.setOptions({
            breaks: true,
            gfm: true
        });
        
        function renderTest() {
            const input = document.getElementById('markdown-input').value;
            const output = marked.parse(input);
            document.getElementById('output').innerHTML = output;
            Prism.highlightAll();
        }
        
        // Render on load
        renderTest();
    </script>
</body>
</html>
